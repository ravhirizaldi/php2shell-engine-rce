# Multi-worker test profile: stock php:8.4.26-apache, prefork, keep-alive.
# This is a lab variant only; the official target profile uses one worker and
# KeepAlive Off (see docker/apache.conf).
KeepAlive On
KeepAliveTimeout 60
MaxKeepAliveRequests 0

# Diagnostic: record the prefork child PID for every request. Docker's
# apache2-foreground exposes stdout at /proc/self/fd/1; docker logs reads it.
# This is lab-only and is not part of the official single-worker target profile.
LogFormat "%h %l %u %t \"%r\" %>s %b pid=%P" p2s

# The stock vhost has its own CustomLog, which overrides the global one for
# requests inside the vhost. Merge a second log into the same vhost.
<VirtualHost *:80>
    CustomLog /proc/self/fd/1 p2s
</VirtualHost>

<IfModule mpm_prefork_module>
    StartServers           4
    MinSpareServers        2
    MaxSpareServers        4
    MaxRequestWorkers      4
    ServerLimit            4
    MaxConnectionsPerChild 0
</IfModule>
