server {
    listen 18443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/tls/cert.pem;
    ssl_certificate_key /etc/nginx/tls/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 0;
    proxy_http_version 1.1;
    proxy_request_buffering off;
    proxy_buffering off;
    # The B1 response is ~1.68 MB and its Set-Cookie header exceeds the
    # default 4-8 KB header buffer; nginx rejects it with 502 before the
    # body is pumped.
    proxy_buffer_size 4m;
    proxy_buffers 8 4m;
    proxy_busy_buffers_size 8m;
    large_client_header_buffers 8 4m;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    proxy_set_header Host $host;
    proxy_set_header Connection "";

    location / {
        proxy_pass http://p2s-target:80;
    }
}
